 carnx_slave_price: "[THIS.Var('slave_price').GetValue]"
 carnx_source: "[THIS.Var('source').GetFlagName]"

 carnx_buyer_merchant_type: "[Select_CString(THIS.Var('buyer').Var('at_merchant_type').IsSet, Concatenate(', ', THIS.Var('buyer').Var('at_merchant_type').GetFlagName), '')]"
 carnx_seller_merchant_type: "[Select_CString(THIS.Var('seller').Var('at_merchant_type').IsSet, Concatenate(', ', THIS.Var('seller').Var('at_merchant_type').GetFlagName), '')]"

 carnx_location: "[THIS.Char.GetCurrentLocation.GetNameNoTooltip]"
 carnx_holding_type: "[THIS.Char.Custom('LocalHoldingType')]"
