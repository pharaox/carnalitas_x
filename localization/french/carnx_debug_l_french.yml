 carnx_debug_msg_visiting_holding_to_trade_slaves: "$carnx_debug_prefix$: Visite d’une seigneurie pour échanger des esclaves, lieu : $carnx_location$, type de seigneurie : $carnx_holding_type$"
 carnx_debug_msg_attempting_slave_haggle: "$carnx_debug_prefix$: Tentative de marchandage d’esclave"

